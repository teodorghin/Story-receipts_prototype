<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receipts: interactive prototype</title>
<style>
:root{--desk:#cfcac1;--ink:#2a2826;--muted:#6f6b64;--chip:#f7f5ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#26241f;--ink:#e8e4dc;--muted:#a09b92;--chip:#3a372f}}
:root[data-theme="dark"]{--desk:#26241f;--ink:#e8e4dc;--muted:#a09b92;--chip:#3a372f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);font-family:"Courier New",monospace;overflow:hidden}
#hint{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);text-align:center;padding:12px;font-size:13px;color:var(--muted);pointer-events:none;z-index:5000}
#bar{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5000}
button{font:inherit;font-size:12px;background:var(--chip);color:var(--ink);border:1px solid var(--muted);border-radius:6px;padding:6px 10px;cursor:pointer}
#log{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:260px;max-height:40vh;overflow:auto;background:var(--chip);border:1px solid var(--muted);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.5;display:none;z-index:5000}
#desk{position:absolute;inset:0;overflow:hidden}
.card{position:absolute;touch-action:none;cursor:grab;perspective:1400px;user-select:none;-webkit-user-select:none}
.card.drag{cursor:grabbing}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.1,.2,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#f7f5ef;box-shadow:0 2px 3px rgba(0,0,0,.25),0 10px 22px rgba(0,0,0,.2);overflow:hidden}
.face img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.back{transform:rotateY(180deg)}
.back img{mix-blend-mode:multiply}
.lift .inner{filter:drop-shadow(0 14px 18px rgba(0,0,0,.25))}
</style></head><body>
<div id="hint">Drag the receipts around. Tap one to turn it over.</div>
<div id="desk"></div>
<div id="log"></div>

    var c=D[i],h=cw/c.ar,col=i%cols,row=Math.floor(i/cols);
    e.style.width=cw+"px";e.style.height=h+"px";
    var x=col*cellW+(cellW-cw)/2+(Math.random()-.5)*cellW*.18;
    var y=50+row*cellH+Math.max(0,(cellH-h)/2)+(Math.random()-.5)*cellH*.12;
    e.style.left=x+"px";e.style.top=y+"px";
    e.style.transform="rotate("+((Math.random()-.5)*9).toFixed(1)+"deg)";
  });
}
D.forEach(function(c){
  var e=document.createElement("div");e.className="card";
  e.innerHTML='<div class="inner"><div class="face"><img src="'+c.f+'" alt="Receipt front"></div><div class="face back">'+(c.b?'<img src="'+c.b+'" alt="Receipt back">':'')+'</div></div>';
  var sx,sy,ox,oy,moved=false,id=null;
  e.addEventListener("pointerdown",function(ev){id=ev.pointerId;e.setPointerCapture(id);sx=ev.clientX;sy=ev.clientY;ox=e.offsetLeft;oy=e.offsetTop;moved=false;e.style.zIndex=++z;e.classList.add("lift")});
  e.addEventListener("pointermove",function(ev){if(id!==ev.pointerId)return;var dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.hypot(dx,dy)>6){moved=true;e.classList.add("drag")}if(moved){e.style.left=ox+dx+"px";e.style.top=oy+dy+"px"}});
  function up(ev){if(id!==ev.pointerId)return;id=null;e.classList.remove("drag","lift");if(!moved){e.classList.toggle("flipped");note("Receipt "+c.n+(e.classList.contains("flipped")?" turned over":" turned back"))}}
  e.addEventListener("pointerup",up);e.addEventListener("pointercancel",up);
  desk.appendChild(e);els.push(e);
});
place();
document.getElementById("rb").onclick=function(){els.forEach(function(e){e.classList.remove("flipped")});place();log=[];t0=Date.now();document.getElementById("log").innerHTML=""};
document.getElementById("lb").onclick=function(){var l=document.getElementById("log");l.style.display=l.style.display==="block"?"none":"block"};
</script></body></html>
